services:
  optionpilot_postgres:
    image: postgres:15-alpine
    container_name: optionpilot_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-optionpilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-optionpilot}
      - POSTGRES_DB=${POSTGRES_DB:-optionpilot}
    volumes:
      - optionpilot_pgdata:/var/lib/postgresql/data
    # no host port: internal-only (inspect via `docker exec optionpilot_postgres psql`);
    # 5433 on the server is already taken and local dev uses its own container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optionpilot} -d ${POSTGRES_DB:-optionpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  optionpilot_agent:
    build: .
    container_name: optionpilot_agent
    env_file: .env
    environment:
      - POSTGRES_HOST=optionpilot_postgres
      - POSTGRES_PORT=5432
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./reports:/app/reports
    depends_on:
      optionpilot_postgres:
        condition: service_healthy
    healthcheck:
      # the loop touches this file every cycle; stale means it is wedged
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -25 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 3m
    restart: unless-stopped

volumes:
  optionpilot_pgdata:
